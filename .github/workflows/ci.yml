name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so a newly-published advisory surfaces without waiting for a push.
    - cron: "0 6 * * 1"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Reads the pnpm version from the "packageManager" field in package.json.
      - uses: pnpm/action-setup@v4

      # 22.13 is the floor: pnpm 11 requires ">=22.13", and React Native 0.86
      # allows "^20.19.4 || ^22.13.0 || ^24.3.0 || >=25". Testing the lowest
      # version both accept is what keeps the documented floor honest.
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13"
          cache: pnpm

      # pnpm blocks dependency lifecycle scripts by default, and --frozen-lockfile
      # fails rather than silently re-resolving if the lockfile is out of date.
      - name: Install
        run: pnpm install --frozen-lockfile

      # Install-time code execution is blocked by pnpm itself: strictDepBuilds
      # defaults to true, so the install above fails on unreviewed build scripts.

      - name: No unreviewed security advisories
        run: pnpm audit

      # Biome parses TypeScript but does not typecheck it, so this is a
      # separate gate — biome ci passes clean on a genuine type error.
      - name: Typecheck
        run: pnpm run typecheck

      # The codebase is all TypeScript; tsc silently skips .js rather than
      # flagging it, so nothing else would catch a file slipping back.
      - name: No untyped JavaScript
        run: pnpm run check:no-js

      - name: Lint and format
        run: pnpm run lint:ci

      - name: Unit tests
        run: pnpm test
