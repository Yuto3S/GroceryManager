# Pausing rapid mode keeps the session live in memory rather than turning it
# into a pending one, so the hub — which read `pending` — offered nothing until
# the app was reloaded. The one moment the user had not asked for it.
#
# Jest covers this now, through a harness that swaps the two screens. This flow
# covers the part the harness fakes: real navigation, with the provider staying
# mounted across it.
#
# LIMITATION, and it is a real one: the iOS Simulator has no camera, so nothing
# can be scanned here. That leaves only the empty-session half of the bug — the
# assertion that pausing with nothing scanned offers nothing. The half that
# actually broke needs a barcode in front of a camera, which on a simulator
# means the Android emulator's virtual scene, not this flow. Do not read a pass
# here as the regression being covered end to end; the Jest harness is what
# covers that.
appId: host.exp.Exponent
env:
  EXPO_URL: exp://127.0.0.1:8081
---
# Stop first: `openLink` on a running Expo Go only brings it to the front, so a
# flow would inherit whatever route the previous one left behind. Killing it
# forces a fresh start at `/`. Stored data survives — that is the point.
- stopApp
# Give the OS a moment to finish tearing Expo Go down: `openLink` fired
# immediately after `stopApp` intermittently times out.
- waitForAnimationToEnd:
    timeout: 5000
- openLink: ${EXPO_URL}

# Expo Go has to fetch and evaluate the bundle after a cold start, which takes
# tens of seconds on a loaded machine. Waiting for the tab bar is waiting for
# the app to actually exist, rather than guessing at a sleep.
- extendedWaitUntil:
    visible:
      id: "tab-pantry"
    timeout: 120000
- tapOn:
    id: "tab-add"

# Clear any session left by an earlier run, so the flow starts from nothing.
- runFlow:
    when:
      visible:
        id: "resume-banner"
    commands:
      - tapOn:
          id: "resume-discard"

- tapOn:
    id: "go-rapid-scan"
# Our own "Allow camera" button, then the system alert behind it. The button
# needs an id like everything else; the alert is not a React Native view, so
# text is the only handle it has.
- runFlow:
    when:
      visible:
        id: "grant-camera"
    commands:
      - tapOn:
          id: "grant-camera"
      - tapOn:
          text: "OK|Allow"
          optional: true

# Nothing has been scanned, so pausing should leave nothing to resume.
- tapOn:
    id: "rapid-pause"
- assertNotVisible:
    id: "resume-banner"
