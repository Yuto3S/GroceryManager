# The single-shot camera had no exit. The screen filled with a live viewfinder
# and nothing on it said you could leave; the only way back was the OS gesture,
# which is not an affordance.
#
# A unit test cannot catch this. It could assert the button exists in the tree —
# and would have passed on the permission screen that shipped stretched down the
# whole page with invisible text. Reaching the control and tapping it is the
# only assertion that means anything here.
appId: host.exp.Exponent
env:
  EXPO_URL: exp://127.0.0.1:8081
---
# Stop first: `openLink` on a running Expo Go only brings it to the front, so a
# flow would inherit whatever route the previous one left behind. Killing it
# forces a fresh start at `/`. Stored data survives — that is the point.
- stopApp
# Give the OS a moment to finish tearing Expo Go down: `openLink` fired
# immediately after `stopApp` intermittently times out.
- waitForAnimationToEnd:
    timeout: 5000
- openLink: ${EXPO_URL}

# Expo Go has to fetch and evaluate the bundle after a cold start, which takes
# tens of seconds on a loaded machine. Waiting for the tab bar is waiting for
# the app to actually exist, rather than guessing at a sleep.
- extendedWaitUntil:
    visible:
      id: "tab-pantry"
    timeout: 120000
- tapOn:
    id: "tab-add"
- tapOn:
    id: "go-scan-one"

# The camera may ask for permission first; take it if offered, and carry on if
# it was already granted on a previous run.
# Our own "Allow camera" button, then the system alert behind it. The button
# needs an id like everything else; the alert is not a React Native view, so
# text is the only handle it has.
- runFlow:
    when:
      visible:
        id: "grant-camera"
    commands:
      - tapOn:
          id: "grant-camera"
      - tapOn:
          text: "OK|Allow"
          optional: true

- assertVisible:
    id: "scan-cancel"
- tapOn:
    id: "scan-cancel"

# Back where we started, not stranded in the camera.
- assertVisible:
    id: "go-scan-one"
